# 代码推送、Pull Request 合并、新建 Pull Request、新建 Issue、Issue 回复时通知企业微信。
# 在仓库 Settings → Secrets and variables → Actions 新增：
#   Name:  WECHAT_WEBHOOK_URL
#   Value: 企业微信群机器人的完整 Webhook 地址
name: 企业微信通知

on:
  push:
    branches:
      - "**"
  pull_request_target:
    types: [opened, closed]
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  notify:
    name: 推送企业微信
    runs-on: ubuntu-latest
    # 删除分支不是提交；关闭但未合并的 Pull Request 不通知。
    # Issue 回复只覆盖 Issue。Pull Request 对话也会触发 issue_comment，这里跳过。
    # pull_request_target 使用目标分支上的工作流，并且不检出 Pull Request 代码。
    if: >-
      (github.event_name != 'push' || github.event.deleted != true) &&
      (
        github.event_name != 'pull_request_target' ||
        github.event.action != 'closed' ||
        github.event.pull_request.merged == true
      ) &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request == null)
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 发送企业微信消息
        env:
          WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          COMPARE_URL: ${{ github.event.compare }}
          FORCED: ${{ github.event.forced }}
          COMMITS_JSON: ${{ toJson(github.event.commits) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_USER: ${{ github.event.pull_request.user.login }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          EVENT_TIME: ${{ github.event.head_commit.timestamp || github.event.pull_request.merged_at || github.event.pull_request.created_at || github.event.comment.created_at || github.event.issue.created_at }}
        run: node .github/scripts/wecom-notify.js
